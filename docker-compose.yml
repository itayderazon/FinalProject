services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nutrition_postgres
    environment:
      POSTGRES_DB: nutrition_app
      POSTGRES_USER: nutrition_user
      POSTGRES_PASSWORD: nutrition_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - nutrition_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition_user -d nutrition_app"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Node.js Backend Server
  nodeserver:
    build:
      context: ./NodeServer
      dockerfile: Dockerfile
    container_name: nutrition_nodeserver
    environment:
      - NODE_ENV=production
      - PORT=3001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=nutrition_app
      - POSTGRES_USER=nutrition_user
      - POSTGRES_PASSWORD=nutrition_password
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - PYTHON_SERVER_URL=http://pythonserver:8000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutrition_network
    volumes:
      - ./NodeServer/logs:/app/logs
    restart: unless-stopped

  # Python FastAPI Server
  pythonserver:
    build:
      context: ./PythonServer
      dockerfile: Dockerfile
    container_name: nutrition_pythonserver
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=nutrition_app
      - POSTGRES_USER=nutrition_user
      - POSTGRES_PASSWORD=nutrition_password
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutrition_network
    restart: unless-stopped

  # React Frontend
  web:
    build:
      context: ./Web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001/api
        - VITE_SERVER_URL=http://localhost:3001
        - VITE_PYTHON_API_URL=http://localhost:8000/api
    container_name: nutrition_web
    ports:
      - "80:80"
    depends_on:
      - nodeserver
      - pythonserver
    networks:
      - nutrition_network
    restart: unless-stopped

  # pgAdmin Database Management Interface
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nutrition_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nutrition.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - nutrition_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  nutrition_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: 